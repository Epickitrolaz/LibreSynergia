name: Build Mobile Apps (Android APK & iOS IPA) — LibreSynergia

on:
  push:
    branches:
      - dev
      - main
      - 'feature/**'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: libresynergia-android-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform iOS Framework
        run: ./gradlew linkReleaseFrameworkIosArm64 --stacktrace

      - name: Build iOS Application
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${PWD}/build/ios/build-output" \
            build

      - name: Package Sideloadable IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/build-output/iosApp.app build/ios/Payload/
          cd build/ios
          zip -r -y libresynergia-ios.ipa Payload
          ls -lh libresynergia-ios.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: libresynergia-ios-ipa
          path: build/ios/libresynergia-ios.ipa
          if-no-files-found: error
          retention-days: 14

